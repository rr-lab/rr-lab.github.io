project:
  type: website
  output-dir: _site
  pre-render: scripts/build_publications.py
  render:
    - "*.qmd"
  resources:
    - CNAME
    - images/**
    - pdfs/**
    - data/**
    - theme/genome.js
    - "!*.Rproj"

website:
  title: "GEMMA Lab"
  site-url: "https://www.gemmalab.org"
  description: >-
    Genetics, Evolution and Metabolism of Maize Adaptation Lab.
    Department of Molecular and Structural Biochemistry, NC State University.
  favicon: images/ncstate.png
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: false
    collapse-below: lg
    logo: images/chromosome-glyph.svg
    logo-alt: ""
    title: "GEMMA Lab"
    left:
      - text: "Research"
        href: research.qmd
      - text: "People"
        href: people.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "News"
        href: news.qmd
      - text: "Talks"
        href: talks.qmd
    right:
      - text: "[Join the lab]{.nav-cta}"
        href: expectations.qmd

  page-footer:
    border: false
    left: |
      **GEMMA Lab**\
      Department of Molecular and Structural Biochemistry,
      NC State University
    center: |
      Plant Sciences Building, 840 Oval Dr, Raleigh, NC 27606\
      Rooms 3122 (office), 3110 (shared open space), 3105 (shared wet lab)\
      [rrellan@ncsu.edu](mailto:rrellan@ncsu.edu), (919) 344-9184\
      Funded by ARPA-E, NSF, FFAR, DOE and USDA.
    right: |
      [Gallery](photos.qmd) · [Collaborators](collaborators.qmd) ·
      [Lab philosophy](expectations.qmd) · [Esfoyaza](esfoyaza.qmd)\
      [GitHub](https://github.com/rr-lab) ·
      [Google Scholar](https://scholar.google.com.mx/citations?user=hdSIEUAAAAAJ&hl=en)

format:
  html:
    theme:
      - cosmo
      - theme/gemma.scss
    include-in-header: theme/head.html
    toc: false
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    grid:
      body-width: 980px
      sidebar-width: 200px
      margin-width: 200px

execute:
  freeze: false

editor: source
