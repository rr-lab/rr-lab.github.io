# People page data. people.Rmd builds the cards from this file.
#
# To add a person: copy an entry anywhere under `current:`. The page shows everyone in one grid,
#   in alphabetical order by first name, so the order here does not matter.
# To add a photo: save a square headshot (about 400 x 400 px) as images/people/<photo name>
#   and set `photo:` to that path. If the file is missing, the card shows a corn-ear placeholder.
# Bios and roles can use Markdown (*italics*, [links](https://...)).
# group:  the role filter on the page: Principal investigator, Postdocs, Graduate students,
#         Undergraduate researchers or Staff.
# themes: the research-theme filter, by the theme ids in research_map.yml (genetics, evolution,
#         metabolism, resilience). A person can have several themes, or none ([]).

current:
