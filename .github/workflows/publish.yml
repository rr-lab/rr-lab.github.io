name: Render and publish site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Allow the workflow to push the built site to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The PDFs are stored with git-lfs; without this the site would
          # publish 132-byte pointer files instead of the papers.
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.40"

      # Quarto reads the generated publication files before its pre-render
      # step runs, so a fresh checkout needs them built first.
      - name: Build the publication list and home page blocks
        run: python3 scripts/build_publications.py

      - name: Render the site
        run: quarto render

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the rendered site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
