# Research map at the top of the Research page. research.Rmd reads this file.
#
# themes:   each theme lists the project sections it covers, by the {#id} written after each
#           "###" heading in research.Rmd. A project can belong to several themes.
#           genome_wide: true colours every chromosome when the theme is selected.
# loci:     only published or preprinted loci go here.
#           start_mb / end_mb are positions on the chromosome; chr_length_mb is that chromosome's
#           length in the assembly the coordinates come from, so the mark lands in the right place.

genome_label: Maize genome (B73)
# Chromosome lengths used to draw the bars (B73 RefGen_v5, Mb)
chromosomes_mb: [308.5, 243.7, 238.0, 250.3, 226.4, 181.4, 185.8, 182.4, 163.0, 152.4]

themes:
  - id: highland
    label: Highland adaptation
    color: "#B4561A"
    summary: How maize adapted to the cold highlands of Mexico, including alleles it borrowed from teosinte *mexicana*.
    sections: [hpc1-structure, highland-introgression, glycerolipids-highland, cold-tolerance]

  - id: lipids
    label: Lipid metabolism
    color: "#6A4BB5"
    summary: How remodeling of membrane lipids helps maize and sorghum cope with cold and low phosphorus.
    sections: [hpc1-structure, glycerolipids-highland, sorghum-lipidomics, candidate-genes]

  - id: nitrogen
    label: Nitrogen
    color: "#4E7D2B"
    summary: Maize and sorghum that need less nitrogen fertilizer and release less N₂O.
    sections: [nsave, nue-pue, zeal, predictive-modeling]

  - id: phosphorus
    label: Phosphorus
    color: "#A4306B"
    summary: Phosphorus use efficiency, from low-phosphorus soils to the phosphorus stored in grain.
    sections: [nue-pue, crispr-phytate, glycerolipids-highland, predictive-modeling, candidate-genes]

  - id: cold
    label: Cold tolerance
    color: "#2D6FB8"
    summary: Alleles and pathways that let maize tolerate cold, so it can be planted earlier.
    sections: [cold-tolerance, sorghum-lipidomics, candidate-genes]

  - id: wild
    label: Teosinte introgressions
    color: "#0E7C86"
    genome_wide: true
    summary: Populations that carry wild teosinte alleles across the whole maize genome, so we can find the useful ones.
    sections: [zeal, cml311-nils, highland-introgression, nsave]

loci:
  - id: inv4m
    label: Inv4m
    italic: true
    chr: 4
    start_mb: 171.7          # Crow et al. 2020, B73 RefGen_v4
    end_mb: 185.9
    chr_length_mb: 247.0     # chromosome 4, B73 RefGen_v4
    themes: [highland]
    url: "https://doi.org/10.64898/2026.06.16.732082"

  - id: hpc1
    label: HPC1
    italic: true
    chr: 3
    start_mb: 8.4976         # Zm00001eb121780, chr3:8,497,640-8,499,737 (B73 RefGen_v5)
    end_mb: 8.4997           # no chr_length_mb: v5 coordinates use chromosomes_mb above
    themes: [highland, lipids]
    url: "https://doi.org/10.1073/pnas.2100036119"
