# Research map at the top of the Research page. research.Rmd reads this file.
#
# themes:   each theme lists the project sections it covers, by the {#id} written after each
#           "###" heading in research.Rmd. Keep each project in one theme so themes don't overlap.
#           genome_wide: true colours every chromosome when the theme is selected.
# loci:     only published or preprinted loci go here.
#           start_mb / end_mb are positions on the chromosome; chr_length_mb is that chromosome's
#           length in the assembly the coordinates come from, so the mark lands in the right place.

genome_label: Maize genome (B73)
# Chromosome lengths used to draw the bars (B73 RefGen_v5, Mb)
chromosomes_mb: [308.5, 243.7, 238.0, 250.3, 226.4, 181.4, 185.8, 182.4, 163.0, 152.4]

themes:
  # Four themes that follow the lab's name: Genetics, Evolution and Metabolism of Maize Adaptation.
  # Each project section belongs to exactly one theme.
  - id: genetics
    label: Genetics and prediction
    color: "#2D6FB8"
    genome_wide: true
    summary: Statistical and machine-learning methods that combine genetic mapping and environmental data to find causal genes and predict which genotypes will thrive where.
    sections: [predictive-modeling, candidate-genes]

  - id: evolution
    label: Evolution and highland adaptation
    color: "#B4561A"
    genome_wide: true
    summary: How maize adapted to the cold highlands of Mexico, and the wild teosinte alleles, from *Inv4m* and *HPC1* to whole introgression libraries, that we can bring back into modern maize.
    sections: [highland-introgression, zeal, cml311-nils]

  - id: metabolism
    label: Lipid metabolism
    color: "#6A4BB5"
    summary: How maize and sorghum remodel their membrane lipids to cope with cold and low phosphorus, from the *HPC1* phospholipase to population-scale lipidomics.
    sections: [hpc1-structure, glycerolipids-highland, sorghum-lipidomics]

  - id: resilience
    label: Resilient, efficient crops
    color: "#4E7D2B"
    summary: Maize and sorghum that need less nitrogen and phosphorus fertilizer, release less N₂O and tolerate cold, so they can be planted earlier.
    sections: [nsave, nue-pue, crispr-phytate, cold-tolerance]

loci:
  - id: inv4m
    label: Inv4m
    italic: true
    chr: 4
    start_mb: 171.7          # Crow et al. 2020, B73 RefGen_v4
    end_mb: 185.9
    chr_length_mb: 247.0     # chromosome 4, B73 RefGen_v4
    themes: [evolution]
    url: "https://doi.org/10.64898/2026.06.16.732082"

  - id: hpc1
    label: HPC1
    italic: true
    chr: 3
    start_mb: 8.4976         # Zm00001eb121780, chr3:8,497,640-8,499,737 (B73 RefGen_v5)
    end_mb: 8.4997           # no chr_length_mb: v5 coordinates use chromosomes_mb above
    themes: [evolution, metabolism]
    url: "https://doi.org/10.1073/pnas.2100036119"
